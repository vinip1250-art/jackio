services:
  jackio:
#    image: ghcr.io/vinip1250-art/jackio:latest
    build: .
    container_name: jackio
    restart: unless-stopped
    network_mode: service:protonvpn
    user: "1001:1001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_FOLDER: /data
    volumes:
      - ../Torrents:/data
    depends_on:
      protonvpn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/manifest.json"] 
      interval: 600s
      timeout: 10s
      retries: 3
      start_period: 30s
